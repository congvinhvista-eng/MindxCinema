<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoftRoll</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="form-panel">
          <div class="logo">
            <img src="logo.png" alt="SoftRoll logo" />
            <div class="brand-text">
              <h1>
                <span class="japanese">ソフトロール</span>
                <span class="softroll">(SoftRoll)</span>
              </h1>
              <p>動画の続きを視聴するにはログインしてください</p>
              <p>Đăng nhập để tiếp tục xem phim</p>
            </div>
          </div>
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" />

          <label for="password">Password:</label>
          <input type="password" id="password" name="password" />

          <button type="submit">Đăng ký</button>
          <p class="register-text">
            Đã có tài khoản?
            <a href="dangnhap.html">Đăng nhập</a>
          </p>
          <p class="register-text">
            すでにアカウントをお持ちですか？
            <a href="dangnhap.html"> ログイン</a>
          </p>
        </div>

        <div class="image-panel">
          <img src="poster.jpg" alt="anime cover" />
        </div>
      </div>
    </div>
  </body>
</html>
