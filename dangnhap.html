<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoftRoll</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="form-panel">
          <div class="logo">
            <img src="logo.png" alt="SoftRoll logo" />
            <div class="brand-text">
              <h1>
                <span class="japanese">ソフトロール</span>
                <span class="softroll">(SoftRoll)</span>
              </h1>

              <p>動画の続きを視聴するにはログインしてください</p>
              <p>Đăng nhập để tiếp tục xem phim</p>
            </div>
          </div>
          <h2>( ログイン)Đăng nhập</h2>
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" />

          <label for="password">Password:</label>
          <input type="password" id="password" name="password" />

          <label class="remember-label">
            <input type="checkbox" id="rememberMe" /> Ghi nhớ đăng nhập(ログイン状態を保持する)
          </label>
          <button type="button" id="loginButton">Đăng nhập</button>
          <p class="register-text">
            Chưa có tài khoản?
            <a href="dangky.html">Đăng ký ngay</a>
          </p>
          <p class="register-text">
            アカウントをお持ちではありませんか？
            <a href="dangky.html">今すぐ登録</a>
          </p>
        </div>

        <div class="image-panel">
          <img src="poster.jpg" alt="anime cover" />
        </div>
      </div>
    </div>
    <script src="auth.js"></script>
  </body>
</html>
